<form class="box-border flex w-64 max-w-full flex-col gap-3 p-2" (submit)="$event.preventDefault(); confirm()">
  @if (seats.length > 0) {
    <ul class="m-0 flex max-h-72 list-none flex-col gap-1 overflow-y-auto p-0" data-testid="deal-choice-list">
      @for (seat of seats; track seat.userId) {
        <li>
          <label class="hover:bg-ui-hover rounded-ui-sm flex cursor-pointer items-center gap-2 px-1 py-0.5 text-[13px]">
            <input
              type="checkbox"
              data-testid="deal-choice-seat"
              [attr.data-user-id]="seat.userId"
              [checked]="isPicked(seat.userId)"
              (change)="toggle(seat.userId)"
            />
            <span class="min-w-0 truncate">{{ seat.name || ('feature.card.hand.unnamed' | transloco) }}</span>
            @if (seat.character) {
              <span class="text-ui-dim shrink-0 text-[11px]">{{
                'feature.card.handOverview.character' | transloco
              }}</span>
            }
          </label>
        </li>
      }
    </ul>
  } @else {
    <p class="text-ui-dim m-0 text-[12px]">{{ 'feature.cardStack.message.noSeats' | transloco }}</p>
  }

  <div class="flex justify-end gap-2">
    <button class="px-2.5 py-1.25 text-[12px]" type="button" (click)="cancel()">
      {{ 'feature.card.drawDialog.cancel' | transloco }}
    </button>
    <button
      class="border-ui-accent bg-ui-accent-solid px-2.5 py-1.25 text-[12px] text-white"
      type="submit"
      data-testid="deal-choice-confirm"
      [disabled]="!anyPicked()"
    >
      {{ 'feature.cardStack.dealChoice.deal' | transloco }}
    </button>
  </div>
</form>
