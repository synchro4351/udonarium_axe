<div
  role="dialog"
  data-testid="chat-stamp-picker"
  class="border-ui-border-panel bg-ui-panel rounded-ui-sm shadow-ui-md box-border flex max-h-72 w-full flex-col gap-0.5 border border-solid p-0.5"
  [attr.aria-label]="'feature.chat.stamp.open' | transloco"
>
  <div
    role="tablist"
    class="border-ui-border-panel flex shrink-0 gap-0.5 overflow-x-auto border-0 border-b border-solid pb-0.5"
    (keydown)="onTabKeydown($event)"
  >
    <button
      type="button"
      role="tab"
      data-testid="chat-stamp-tab"
      class="rounded-ui-sm hover:bg-ui-hover min-h-6 shrink-0 cursor-pointer border-0 bg-transparent px-1.5 text-[11px] whitespace-nowrap transition-colors"
      [class.bg-ui-accent-bg]="activeTab() === emojiTab"
      [class.text-ui-accent]="activeTab() === emojiTab"
      [attr.aria-selected]="activeTab() === emojiTab"
      [attr.tabindex]="activeTab() === emojiTab ? 0 : -1"
      (click)="selectTab(emojiTab)"
    >
      {{ 'feature.chat.stamp.emojiTab' | transloco }}
    </button>
    <button
      type="button"
      role="tab"
      data-testid="chat-stamp-tab"
      class="rounded-ui-sm hover:bg-ui-hover min-h-6 shrink-0 cursor-pointer border-0 bg-transparent px-1.5 text-[11px] whitespace-nowrap transition-colors"
      [class.bg-ui-accent-bg]="activeTab() === syntaxTab"
      [class.text-ui-accent]="activeTab() === syntaxTab"
      [attr.aria-selected]="activeTab() === syntaxTab"
      [attr.tabindex]="activeTab() === syntaxTab ? 0 : -1"
      (click)="selectTab(syntaxTab)"
    >
      {{ 'feature.chat.syntax.tab' | transloco }}
    </button>
  </div>
  <div role="tabpanel" class="min-h-0 overflow-y-auto">
    @if (activeTab() === syntaxTab) {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(120px,1fr))] gap-px">
        @for (snippet of snippets; track snippet.id) {
          <button
            type="button"
            data-testid="chat-syntax-choice"
            class="rounded-ui-sm hover:bg-ui-hover focus-visible:bg-ui-hover flex min-h-7 min-w-0 cursor-pointer flex-col items-start justify-center border-0 bg-transparent px-1 py-px text-left transition-colors"
            [attr.data-syntax]="snippet.id"
            [title]="'feature.chat.syntax.items.' + snippet.id + '.hint' | transloco"
            (click)="pickSyntax(snippet)"
          >
            <span class="text-ui-text max-w-full truncate text-[11px]">{{
              'feature.chat.syntax.items.' + snippet.id + '.name' | transloco
            }}</span>
            <code class="text-ui-dim max-w-full truncate font-mono text-[10px]">{{ exampleOf(snippet) }}</code>
          </button>
        }
      </div>
    } @else {
      <div class="flex flex-wrap gap-px">
        @for (emoji of emojis; track emoji) {
          <button
            type="button"
            data-testid="chat-emoji-choice"
            class="rounded-ui-sm hover:bg-ui-hover focus-visible:bg-ui-hover inline-flex size-7 cursor-pointer items-center justify-center border-0 bg-transparent p-0 text-[17px] leading-none transition-colors"
            [attr.aria-label]="emoji"
            (click)="pickEmoji(emoji)"
          >
            {{ emoji }}
          </button>
        }
      </div>
    }
  </div>
</div>
