<div class="flex flex-col gap-1.5 text-[11px]">
  <label class="text-ui-muted flex flex-col gap-1">
    <span>{{ 'feature.media.cutIn.portraitCharacter' | transloco }}</span>
    <select class="bg-ui-input text-ui-text rounded-ui-sm p-1" name="cut-in-portrait-character" [(ngModel)]="character">
      <option value="">{{ 'feature.media.cutIn.portraitNone' | transloco }}</option>
      @for (one of characters; track one.identifier) {
        <option [value]="one.identifier">{{ one.name }}</option>
      }
    </select>
  </label>
  @if (character && showsImage()) {
    <label class="text-ui-muted flex flex-col gap-1">
      <span>{{ 'feature.media.cutIn.portraitImage' | transloco }}</span>
      <select class="bg-ui-input text-ui-text rounded-ui-sm p-1" name="cut-in-portrait-image" [(ngModel)]="image">
        <option value="">{{ 'feature.media.cutIn.portraitNone' | transloco }}</option>
        @for (choice of images; track choice.index) {
          <option [value]="choice.imageIdentifier">{{ choice.name || '#' + (choice.index + 1) }}</option>
        }
      </select>
    </label>
  }
  @if (showsImage()) {
    <p class="text-ui-dim m-0 leading-snug" data-testid="cut-in-portrait-fit-note">
      {{ 'feature.media.cutIn.portraitFitOnSheet' | transloco }}
    </p>
  }
</div>
