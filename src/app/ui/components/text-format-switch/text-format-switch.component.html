<div
  class="border-ui-border-panel rounded-ui-sm inline-flex overflow-hidden border border-solid text-[0.78rem]"
  role="radiogroup"
  [attr.aria-label]="'feature.textNote.format.label' | transloco"
>
  @for (format of formats; track format) {
    <button
      class="text-ui-muted hover:bg-ui-hover hover:text-ui-text cursor-pointer border-none bg-transparent px-2 py-0.5 leading-[1.4] whitespace-nowrap transition-[background,color] disabled:cursor-default disabled:opacity-50"
      [class.bg-ui-accent-bg!]="value() === format"
      [class.text-ui-accent!]="value() === format"
      [class.font-semibold]="value() === format"
      type="button"
      role="radio"
      [attr.aria-checked]="value() === format"
      [attr.data-format]="format"
      [disabled]="disabled()"
      (click)="select(format)"
    >
      {{ 'feature.textNote.format.' + format | transloco }}
    </button>
  }
</div>
